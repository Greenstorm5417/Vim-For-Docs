<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Command List - Vim-For-Docs</title>
  <style>
    :root { --primary-color: #1a73e8; --border-color: #e0e0e0; --hover-bg: #f5f5f5; }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      color: #333;
    }
    .header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid var(--primary-color); flex-wrap: wrap; }
    .header h1 { margin: 0; font-size: 20px; color: var(--primary-color); }
    .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    input[type="search"] { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; min-width: 220px; }
    .btn { padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; background: #fff; cursor: pointer; font-size: 14px; color: #333; text-decoration: none; display: inline-block; }
    .status { margin-bottom: 12px; font-size: 13px; }
    .status.ok { color: #137333; }
    .status.err { color: #c5221f; }
    .status.warn { color: #b06000; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border-color); vertical-align: top; font-size: 13px; }
    th { color: #555; font-size: 12px; }
    tr:hover { background: var(--hover-bg); }
    .keys { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .footer { margin-top: 16px; font-size: 12px; color: #666; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Command List</h1>
    <div class="actions">
      <label for="search">Search</label>
      <input type="search" id="search" placeholder="Filter section, id, keys, modes…" />
      <a class="btn" href="motions.html">Motions Editor</a>
    </div>
  </div>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <table>
    <thead>
      <tr>
        <th>Section</th>
        <th>ID</th>
        <th>Keys</th>
        <th>Modes</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="footer">
    Visual block mode is not present. Ex substitution (<code>:s</code>) and ranges are blocked.
    This page lists key bindings only — no document or clipboard contents.
  </div>
  <script src="../config.js"></script>
  <script src="commands.js"></script>
</body>
</html>
